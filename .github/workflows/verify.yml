name: Verify TodayNepal Studio
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-fund
      - name: Parse check for JavaScript
        run: |
          for file in src/*.js api/*.js; do node --check "$file"; done
      - name: Run behavior and API tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser workflow tests
        run: npm run test:browser
